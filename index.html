<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="pt-BR">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    
    <main class="container">
        <h2>Gestão de Produtos</h2>

        <form id="form-produto">
            <input type="hidden" id="produto-id">

            <div class="campo">
                <label for="nome">Nome do Produto</label>
                <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico">   
            </div>
            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" min="0" required placeholder="0">
            </div>
            <div class="campo">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" min="0" required placeholder="0.00">
            </div>

            <button type="submit" id="btn-salvar">Cadastrar Produto</button>
            <button type="button" id="btn-cancelar" style="display: nome;">Cancelar</button>
        </form>

        <hr>

        <h3>Produtos no Estoque</h3>

        <div class="campo-busca">
            <label for="input-busca">Pesquisar Produto</label>
            <input type="text" id="input-busca" placeholder="Digite o nome ou ID...">
        </div>

        <div class="container-tabela">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos"></tbody>
        </table>
        </div>
        <script src="produtos.js"></script>
    </main>
</body>
</html>
